name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Unity Android (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@v1.2.0
        with:
          android: true
          dotnet: true
          haskell: true
          tool-cache: true
          large-packages: false
          swap-storage: false

      - name: Disk check
        run: df -h /

      - name: Checkout private source (branch smoke)
        uses: actions/checkout@v4
        with:
          repository: tumbal-page/pyramid-port-source
          ref: smoke
          token: ${{ secrets.PAT_PRIVATE }}
          path: project

      - name: Build Android APK
        uses: game-ci/unity-builder@v5
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: project
          unityVersion: 6000.4.10f1
          targetPlatform: Android
          buildMethod: SmokeBuild.Build
          buildsPath: build

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Smoke-APK
          path: build/Android/*.apk
          retention-days: 1
