name: Acquire activation file
on:
  workflow_dispatch:

jobs:
  activation:
    name: Request manual activation file
    runs-on: ubuntu-latest
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/.ghcup
      - name: Generate .alf file via Docker
        run: |
          IMAGE="unityci/editor:ubuntu-6000.4.10f1-base-4.0.0"
          docker pull "$IMAGE" || { IMAGE="unityci/editor:ubuntu-6000.4.10f1-android-4.0.0"; docker pull "$IMAGE"; }
          docker run --rm -v "${{ github.workspace }}:/work" -w /work "$IMAGE" \
            unity-editor -batchmode -nographics -createManualActivationFile -logfile /dev/stdout || true
          ls -lh *.alf
      - name: Upload .alf artifact
        uses: actions/upload-artifact@v4
        with:
          name: unity-activation-file
          path: "*.alf"
